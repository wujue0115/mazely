name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          MAZELY_VERSION="$(node -p "require('./packages/mazely/package.json').version")"

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag must point to a commit on main"
            exit 1
          fi

          if [[ "$VERSION" != "$ROOT_VERSION" ]]; then
            echo "::error::Tag version $VERSION does not match workspace root $ROOT_VERSION"
            exit 1
          fi

          if [[ "$VERSION" != "$CORE_VERSION" ]]; then
            echo "::error::Tag version $VERSION does not match @mazely/core $CORE_VERSION"
            exit 1
          fi

          if [[ "$VERSION" != "$MAZELY_VERSION" ]]; then
            echo "::error::Tag version $VERSION does not match mazely $MAZELY_VERSION"
            exit 1
          fi

          node scripts/changelog.mjs verify "$VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release
        run: pnpm test:ci

      - name: Publish packages
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/publish-packages.mjs "$VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/changelog.mjs extract "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
